name: project-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python SDK tests
        run: PYTHONPATH=packages/python-sdk/src python -m unittest discover -s packages/python-sdk/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -w @hex-neural/editor
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g255-browser-evidence
          path: apps/editor/test-results
          if-no-files-found: error
