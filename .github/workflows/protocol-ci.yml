name: project-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: G-209 measured autoscaling benchmark
        run: node packages/protocol/benchmark/autoscaling-benchmark.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -w @hex-neural/editor
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g197-browser-evidence
          path: apps/editor/test-results
          if-no-files-found: warn
